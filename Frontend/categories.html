<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - IMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle" onclick="toggleMobileMenu()">☰</button>
          <div class="page-breadcrumb">Catalog / <strong>Categories</strong></div>
        </div>
        <div class="topbar-right">
          <a href="products.html?filter=low" id="lowStockPill" class="badge-alert" style="display:none;"></a>
        </div>
      </header>

      <div class="content-area">
        <div class="page-header">
          <div class="page-title">
            <h1>Category Classifications</h1>
            <p>Organize products into structured categories for streamlined tracking.</p>
          </div>
          <button class="btn-primary" style="width:auto; padding:10px 18px;" onclick="openAddCatModal()">
            <span>+ Add New Category</span>
          </button>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Category Name</th>
                  <th>Description</th>
                  <th>Associated Products</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="categoriesBody">
                <tr><td colspan="5" style="text-align:center; padding:24px; color:var(--slate-500);">Loading categories...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Category Modal -->
  <div class="modal-overlay" id="catModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="catModalTitle">Add Category</h3>
        <button class="modal-close" onclick="closeModal('catModal')">✕</button>
      </div>
      <form id="catForm">
        <div class="modal-body">
          <input type="hidden" id="editCatId">
          <div class="form-group">
            <label for="catName">Category Name *</label>
            <input type="text" id="catName" placeholder="e.g. Industrial Tools" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('catModal')">Cancel</button>
          <button type="submit" class="btn-primary" style="width:auto;">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderAppShell('Categories');

    let allCategories = [];

    async function loadCategories() {
      const res = await apiFetch('/categories');
      const tbody = document.getElementById('categoriesBody');

      if (!res || !res.ok) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--danger);">Failed to load categories.</td></tr>';
        return;
      }

      allCategories = res.data;

      if (allCategories.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:32px; color:var(--slate-500);">No categories found. Click "+ Add New Category" to create one.</td></tr>';
        return;
      }

      tbody.innerHTML = allCategories.map(c => `
        <tr>
          <td><strong>#${c.id}</strong></td>
          <td><strong>${c.name}</strong></td>
          <td>${c.description || '<span style="color:var(--slate-400);">No description</span>'}</td>
          <td>
            <span class="pill pill-primary">${c.product_count || 0} Products</span>
          </td>
          <td>
            <div class="action-btns">
              <button class="btn-sm btn-sm-edit" onclick="openEditCatModal(${c.id}, '${c.name.replace(/'/g, "\\'")}')">Edit</button>
              <button class="btn-sm btn-sm-del" onclick="deleteCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openAddCatModal() {
      document.getElementById('catModalTitle').textContent = 'Add New Category';
      document.getElementById('editCatId').value = '';
      document.getElementById('catForm').reset();
      openModal('catModal');
    }

    function openEditCatModal(id, name) {
      document.getElementById('catModalTitle').textContent = 'Edit Category';
      document.getElementById('editCatId').value = id;
      document.getElementById('catName').value = name;
      openModal('catModal');
    }

    document.getElementById('catForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editCatId').value;
      const name = document.getElementById('catName').value.trim();

      const method = id ? 'PUT' : 'POST';
      const endpoint = id ? `/categories/${id}` : '/categories';

      const res = await apiFetch(endpoint, {
        method,
        body: JSON.stringify({ name })
      });

      if (res && res.ok) {
        showToast(`Category ${id ? 'updated' : 'created'} successfully!`, 'success');
        closeModal('catModal');
        loadCategories();
      } else {
        showToast(res.data.error || 'Failed to save category.', 'error');
      }
    });

    async function deleteCategory(id, name) {
      if (!confirm(`Are you sure you want to delete category "${name}"? Products in this category will become unassigned.`)) {
        return;
      }

      const res = await apiFetch(`/categories/${id}`, { method: 'DELETE' });
      if (res && res.ok) {
        showToast('Category deleted successfully.', 'success');
        loadCategories();
      } else {
        showToast(res.data.error || 'Failed to delete category.', 'error');
      }
    }

    loadCategories();
  </script>
</body>
</html>
