<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - iONE Inventory Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">iONE</div>
      <h1>Inventory Management System</h1>
      <p>Please enter your credentials to access the portal</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Username" value="admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" value="admin123" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn-primary" style="width:100%; padding:10px; margin-top:8px;">
        Sign In
      </button>
    </form>

    <div class="login-hint-box">
      Default Login: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code>
    </div>

    <div class="login-footer-text">
      iONE IT Solutions Pvt. Ltd. &bull; Internal System
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showToast(data.error || 'Invalid username or password', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return;
        }

        localStorage.setItem('ims_token', data.token);
        localStorage.setItem('ims_user', username);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 400);

      } catch (err) {
        showToast('Unable to connect to server. Check backend status.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    if (getToken()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
