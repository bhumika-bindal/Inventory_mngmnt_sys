<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - iONE IMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle-btn" onclick="toggleMobileMenu()">☰</button>
          <div class="breadcrumb">Catalog / <strong>Products</strong></div>
        </div>
        <div class="topbar-right">
          <a href="products.html?filter=low" id="lowStockPill" class="alert-badge-link" style="display:none;"></a>
        </div>
      </header>

      <div class="content-area">
        <div class="page-header">
          <div class="page-title">
            <h1>Products</h1>
            <p>Manage product catalog, pricing, suppliers, and reorder levels.</p>
          </div>
          <button class="btn-primary" onclick="openAddModal()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            <span>Add Product</span>
          </button>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="toolbar-wrap">
          <div class="search-box">
            <span class="search-icon">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search by name, category, or supplier..." oninput="handleSearch()">
          </div>

          <select class="select-filter" id="categoryFilter" onchange="loadProducts()">
            <option value="">All Categories</option>
          </select>

          <select class="select-filter" id="supplierFilter" onchange="loadProducts()">
            <option value="">All Suppliers</option>
          </select>

          <select class="select-filter" id="statusFilter" onchange="loadProducts()">
            <option value="">All Stock Levels</option>
            <option value="in_stock">In Stock</option>
            <option value="low_stock">Low Stock</option>
            <option value="out_of_stock">Out of Stock</option>
          </select>

          <button class="btn-secondary" onclick="resetFilters()">Reset</button>
        </div>

        <!-- Products Table Card -->
        <div class="card">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Product Name</th>
                  <th>Category</th>
                  <th>Supplier</th>
                  <th>Price</th>
                  <th>Quantity</th>
                  <th>Limit</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="productsBody">
                <tr><td colspan="9" style="text-align:center; padding:20px; color:var(--gray-500);">Loading products...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Product Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Add Product</h3>
        <button class="modal-close-btn" onclick="closeModal('productModal')">✕</button>
      </div>
      <form id="productForm">
        <div class="modal-body">
          <input type="hidden" id="editProductId">

          <div class="form-group">
            <label for="pName">Product Name *</label>
            <input type="text" id="pName" placeholder="e.g. Dell PowerEdge Server" required>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label for="pCategory">Category</label>
              <select id="pCategory">
                <option value="">Select Category</option>
              </select>
            </div>

            <div class="form-group">
              <label for="pSupplier">Supplier</label>
              <select id="pSupplier">
                <option value="">Select Supplier</option>
              </select>
            </div>
          </div>

          <div class="form-row-3">
            <div class="form-group">
              <label for="pPrice">Price (₹) *</label>
              <input type="number" id="pPrice" step="0.01" min="0" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label for="pQty" id="pQtyLabel">Quantity</label>
              <input type="number" id="pQty" min="0" value="0">
            </div>

            <div class="form-group">
              <label for="pLimit">Low Stock Limit</label>
              <input type="number" id="pLimit" min="0" value="5">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('productModal')">Cancel</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderAppShell('Products');

    let allProducts = [];
    let categoriesList = [];
    let suppliersList = [];

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('filter') === 'low') {
      document.getElementById('statusFilter').value = 'low_stock';
    }

    async function loadMetaFilters() {
      const [catsRes, supsRes] = await Promise.all([
        apiFetch('/categories'),
        apiFetch('/suppliers')
      ]);

      if (catsRes && catsRes.ok) {
        categoriesList = catsRes.data;
        const catFilter = document.getElementById('categoryFilter');
        const modalCat = document.getElementById('pCategory');
        catFilter.innerHTML = '<option value="">All Categories</option>' + 
          categoriesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        modalCat.innerHTML = '<option value="">Select Category</option>' + 
          categoriesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }

      if (supsRes && supsRes.ok) {
        suppliersList = supsRes.data;
        const supFilter = document.getElementById('supplierFilter');
        const modalSup = document.getElementById('pSupplier');
        supFilter.innerHTML = '<option value="">All Suppliers</option>' + 
          suppliersList.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        modalSup.innerHTML = '<option value="">Select Supplier</option>' + 
          suppliersList.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      }
    }

    async function loadProducts() {
      const search = document.getElementById('searchInput').value.trim();
      const category_id = document.getElementById('categoryFilter').value;
      const supplier_id = document.getElementById('supplierFilter').value;
      const status = document.getElementById('statusFilter').value;

      const params = new URLSearchParams();
      if (search) params.append('search', search);
      if (category_id) params.append('category_id', category_id);
      if (supplier_id) params.append('supplier_id', supplier_id);
      if (status) params.append('status', status);

      const res = await apiFetch(`/products?${params.toString()}`);
      const tbody = document.getElementById('productsBody');

      if (!res || !res.ok) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:20px; color:var(--red);">Failed to load products</td></tr>';
        return;
      }

      allProducts = res.data;

      if (allProducts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:28px; color:var(--gray-500);">No products found matching filters.</td></tr>';
        return;
      }

      tbody.innerHTML = allProducts.map(p => {
        let badgeHtml = '';
        if (p.quantity === 0) {
          badgeHtml = '<span class="badge badge-danger">Out of Stock</span>';
        } else if (p.quantity <= p.low_stock_limit) {
          badgeHtml = '<span class="badge badge-warning">Low Stock</span>';
        } else {
          badgeHtml = '<span class="badge badge-success">In Stock</span>';
        }

        return `
          <tr>
            <td>#${p.id}</td>
            <td><strong>${p.name}</strong></td>
            <td><span class="badge badge-neutral">${p.category || '-'}</span></td>
            <td>${p.supplier || '-'}</td>
            <td>₹${Number(p.price).toLocaleString('en-IN')}</td>
            <td><strong>${p.quantity}</strong></td>
            <td>${p.low_stock_limit}</td>
            <td>${badgeHtml}</td>
            <td>
              <div class="btn-action-group">
                <button class="btn-tbl-sm btn-tbl-edit" onclick="openEditModal(${p.id})">Edit</button>
                <button class="btn-tbl-sm btn-tbl-delete" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    let searchTimeout = null;
    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { loadProducts(); }, 250);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = '';
      document.getElementById('supplierFilter').value = '';
      document.getElementById('statusFilter').value = '';
      loadProducts();
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Product';
      document.getElementById('editProductId').value = '';
      document.getElementById('productForm').reset();
      openModal('productModal');
    }

    function openEditModal(id) {
      const p = allProducts.find(item => item.id === id);
      if (!p) return;

      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('editProductId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pCategory').value = p.category_id || '';
      document.getElementById('pSupplier').value = p.supplier_id || '';
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pQty').value = p.quantity;
      document.getElementById('pLimit').value = p.low_stock_limit;

      openModal('productModal');
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;

      const payload = {
        name: document.getElementById('pName').value.trim(),
        category_id: document.getElementById('pCategory').value || null,
        supplier_id: document.getElementById('pSupplier').value || null,
        price: parseFloat(document.getElementById('pPrice').value),
        quantity: parseInt(document.getElementById('pQty').value, 10) || 0,
        low_stock_limit: parseInt(document.getElementById('pLimit').value, 10) || 5
      };

      const method = editId ? 'PUT' : 'POST';
      const endpoint = editId ? `/products/${editId}` : '/products';

      const res = await apiFetch(endpoint, {
        method,
        body: JSON.stringify(payload)
      });

      if (res && res.ok) {
        showToast(`Product ${editId ? 'updated' : 'created'} successfully`, 'success');
        closeModal('productModal');
        loadProducts();
        updateLowStockAlertBadge();
      } else {
        showToast(res.data.error || 'Failed to save product', 'error');
      }
    });

    async function deleteProduct(id, name) {
      if (!confirm(`Are you sure you want to delete "${name}"?`)) {
        return;
      }

      const res = await apiFetch(`/products/${id}`, { method: 'DELETE' });
      if (res && res.ok) {
        showToast('Product deleted', 'success');
        loadProducts();
        updateLowStockAlertBadge();
      } else {
        showToast(res.data.error || 'Failed to delete product', 'error');
      }
    }

    async function init() {
      await loadMetaFilters();
      await loadProducts();
    }
    init();
  </script>
</body>
</html>
