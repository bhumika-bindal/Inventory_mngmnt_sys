<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - iONE IMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle-btn" onclick="toggleMobileMenu()">☰</button>
          <div class="breadcrumb">Directory / <strong>Suppliers</strong></div>
        </div>
        <div class="topbar-right">
          <a href="products.html?filter=low" id="lowStockPill" class="alert-badge-link" style="display:none;"></a>
        </div>
      </header>

      <div class="content-area">
        <div class="page-header">
          <div class="page-title">
            <h1>Suppliers & Vendors</h1>
            <p>Manage OEM partners, hardware vendors, and procurement contacts.</p>
          </div>
          <button class="btn-primary" onclick="openAddSupplierModal()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
            <span>Add Supplier</span>
          </button>
        </div>

        <div class="card">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Supplier Name</th>
                  <th>Phone</th>
                  <th>Email</th>
                  <th>Location</th>
                  <th>Products</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="suppliersBody">
                <tr><td colspan="7" style="text-align:center; padding:20px; color:var(--gray-500);">Loading suppliers...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Supplier Modal -->
  <div class="modal-overlay" id="supplierModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="supModalTitle">Add Supplier</h3>
        <button class="modal-close-btn" onclick="closeModal('supplierModal')">✕</button>
      </div>
      <form id="supplierForm">
        <div class="modal-body">
          <input type="hidden" id="editSupId">

          <div class="form-group">
            <label for="sName">Supplier Name *</label>
            <input type="text" id="sName" placeholder="e.g. Dell Technologies" required>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label for="sPhone">Phone Number</label>
              <input type="text" id="sPhone" placeholder="+91 98765 43210">
            </div>

            <div class="form-group">
              <label for="sEmail">Email Address</label>
              <input type="email" id="sEmail" placeholder="contact@vendor.com">
            </div>
          </div>

          <div class="form-group">
            <label for="sAddress">Address / Location</label>
            <textarea id="sAddress" rows="2" placeholder="Office location, city, state..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('supplierModal')">Cancel</button>
          <button type="submit" class="btn-primary">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderAppShell('Suppliers');

    let allSuppliers = [];

    async function loadSuppliers() {
      const res = await apiFetch('/suppliers');
      const tbody = document.getElementById('suppliersBody');

      if (!res || !res.ok) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:var(--red);">Failed to load suppliers</td></tr>';
        return;
      }

      allSuppliers = res.data;

      if (allSuppliers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:24px; color:var(--gray-500);">No suppliers found. Click "Add Supplier" to create one.</td></tr>';
        return;
      }

      tbody.innerHTML = allSuppliers.map(s => `
        <tr>
          <td>#${s.id}</td>
          <td><strong>${s.name}</strong></td>
          <td>${s.phone ? `<a href="tel:${s.phone}" style="color:var(--brand-blue);text-decoration:none;">${s.phone}</a>` : '-'}</td>
          <td>${s.email ? `<a href="mailto:${s.email}" style="color:var(--brand-blue);text-decoration:none;">${s.email}</a>` : '-'}</td>
          <td>${s.address || '-'}</td>
          <td><span class="badge badge-info">${s.product_count || 0} Products</span></td>
          <td>
            <div class="btn-action-group">
              <button class="btn-tbl-sm btn-tbl-edit" onclick="openEditSupModal(${s.id})">Edit</button>
              <button class="btn-tbl-sm btn-tbl-delete" onclick="deleteSupplier(${s.id}, '${s.name.replace(/'/g, "\\'")}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openAddSupplierModal() {
      document.getElementById('supModalTitle').textContent = 'Add Supplier';
      document.getElementById('editSupId').value = '';
      document.getElementById('supplierForm').reset();
      openModal('supplierModal');
    }

    function openEditSupModal(id) {
      const s = allSuppliers.find(item => item.id === id);
      if (!s) return;

      document.getElementById('supModalTitle').textContent = 'Edit Supplier';
      document.getElementById('editSupId').value = s.id;
      document.getElementById('sName').value = s.name;
      document.getElementById('sPhone').value = s.phone || '';
      document.getElementById('sEmail').value = s.email || '';
      document.getElementById('sAddress').value = s.address || '';
      openModal('supplierModal');
    }

    document.getElementById('supplierForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editSupId').value;

      const payload = {
        name: document.getElementById('sName').value.trim(),
        phone: document.getElementById('sPhone').value.trim() || null,
        email: document.getElementById('sEmail').value.trim() || null,
        address: document.getElementById('sAddress').value.trim() || null
      };

      const method = id ? 'PUT' : 'POST';
      const endpoint = id ? `/suppliers/${id}` : '/suppliers';

      const res = await apiFetch(endpoint, {
        method,
        body: JSON.stringify(payload)
      });

      if (res && res.ok) {
        showToast(`Supplier ${id ? 'updated' : 'created'} successfully`, 'success');
        closeModal('supplierModal');
        loadSuppliers();
      } else {
        showToast(res.data.error || 'Failed to save supplier', 'error');
      }
    });

    async function deleteSupplier(id, name) {
      if (!confirm(`Are you sure you want to delete "${name}"? Associated products will remain in catalog.`)) {
        return;
      }

      const res = await apiFetch(`/suppliers/${id}`, { method: 'DELETE' });
      if (res && res.ok) {
        showToast('Supplier deleted', 'success');
        loadSuppliers();
      } else {
        showToast(res.data.error || 'Failed to delete supplier', 'error');
      }
    }

    loadSuppliers();
  </script>
</body>
</html>
