<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Movement - iONE IMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebar-mount"></div>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-toggle-btn" onclick="toggleMobileMenu()">☰</button>
          <div class="breadcrumb">Operations / <strong>Stock In & Out</strong></div>
        </div>
        <div class="topbar-right">
          <a href="products.html?filter=low" id="lowStockPill" class="alert-badge-link" style="display:none;"></a>
        </div>
      </header>

      <div class="content-area">
        <div class="page-header">
          <div class="page-title">
            <h1>Stock Movement</h1>
            <p>Record stock additions (IN) and disbursements or dispatches (OUT).</p>
          </div>
        </div>

        <!-- Movement Entry Card -->
        <div class="card">
          <div class="card-header">
            <h2>Record Stock Transaction</h2>
          </div>
          <div class="card-body">
            <form id="stockForm">
              <div class="form-row-3">
                <div class="form-group">
                  <label for="sProduct">Product *</label>
                  <select id="sProduct" required onchange="handleProductSelect()">
                    <option value="">-- Select Product --</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="sType">Movement Type *</label>
                  <select id="sType" required onchange="updateStockPreview()">
                    <option value="IN">Stock IN (Receive / Purchase)</option>
                    <option value="OUT">Stock OUT (Issue / Dispatch)</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="sQty">Quantity *</label>
                  <input type="number" id="sQty" min="1" value="10" required oninput="updateStockPreview()">
                </div>
              </div>

              <!-- Live Projected Stock Preview -->
              <div id="stockPreviewBanner" style="padding:10px 14px; background:var(--gray-50); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; font-size:13px; display:flex; align-items:center; justify-content:space-between;">
                <div>
                  <span style="color:var(--gray-500);">Current Stock:</span> <strong id="previewCurrentQty">--</strong>
                  <span style="margin: 0 10px; color:var(--gray-400);">&rarr;</span>
                  <span style="color:var(--gray-500);">Projected:</span> <strong id="previewProjectedQty" style="color:var(--brand-blue);">--</strong>
                </div>
                <div id="previewStatusBadge"></div>
              </div>

              <div class="form-group">
                <label for="sNote">Notes / Reference (Optional)</label>
                <input type="text" id="sNote" placeholder="e.g. Shipment received under PO #1042">
              </div>

              <button type="submit" class="btn-primary" style="margin-top:6px;">
                Submit Movement
              </button>
            </form>
          </div>
        </div>

        <!-- History Ledger Card -->
        <div class="card">
          <div class="card-header">
            <h2>Recent Movements</h2>
            <div>
              <select class="select-filter" id="ledgerTypeFilter" onchange="loadMovements()">
                <option value="">All Types</option>
                <option value="IN">Only Stock IN</option>
                <option value="OUT">Only Stock OUT</option>
              </select>
            </div>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Product</th>
                  <th>Type</th>
                  <th>Quantity</th>
                  <th>Notes</th>
                  <th>Date & Time</th>
                </tr>
              </thead>
              <tbody id="stockBody">
                <tr><td colspan="6" style="text-align:center; padding:20px; color:var(--gray-500);">Loading movements...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderAppShell('Stock Ops');

    let productsList = [];

    async function loadProductsDropdown() {
      const res = await apiFetch('/products');
      if (!res || !res.ok) return;
      productsList = res.data;
      const select = document.getElementById('sProduct');
      select.innerHTML = '<option value="">-- Select Product --</option>' +
        productsList.map(p => `<option value="${p.id}" data-qty="${p.quantity}">${p.name} (Stock: ${p.quantity})</option>`).join('');
    }

    function handleProductSelect() {
      updateStockPreview();
    }

    function updateStockPreview() {
      const select = document.getElementById('sProduct');
      const selectedOption = select.options[select.selectedIndex];
      const type = document.getElementById('sType').value;
      const qtyInput = document.getElementById('sQty');
      const qty = parseInt(qtyInput.value, 10) || 0;

      if (!selectedOption || !selectedOption.value) {
        document.getElementById('previewCurrentQty').textContent = '--';
        document.getElementById('previewProjectedQty').textContent = '--';
        document.getElementById('previewStatusBadge').innerHTML = '';
        return;
      }

      const currentQty = parseInt(selectedOption.getAttribute('data-qty'), 10) || 0;
      document.getElementById('previewCurrentQty').textContent = `${currentQty} units`;

      let projected = type === 'IN' ? currentQty + qty : currentQty - qty;
      const badge = document.getElementById('previewStatusBadge');

      if (type === 'OUT' && currentQty < qty) {
        document.getElementById('previewProjectedQty').textContent = `${projected} (Insufficient Stock)`;
        document.getElementById('previewProjectedQty').style.color = 'var(--red)';
        badge.innerHTML = '<span class="badge badge-danger">Not enough stock</span>';
      } else {
        document.getElementById('previewProjectedQty').textContent = `${projected} units`;
        document.getElementById('previewProjectedQty').style.color = type === 'IN' ? 'var(--green)' : 'var(--gray-900)';
        badge.innerHTML = type === 'IN' 
          ? '<span class="badge badge-success">+ Addition</span>' 
          : '<span class="badge badge-warning">- Deduction</span>';
      }
    }

    async function loadMovements() {
      const typeFilter = document.getElementById('ledgerTypeFilter').value;
      const endpoint = typeFilter ? `/stock?type=${typeFilter}` : '/stock';

      const res = await apiFetch(endpoint);
      const tbody = document.getElementById('stockBody');

      if (!res || !res.ok) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--red);">Failed to load movements</td></tr>';
        return;
      }

      if (res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:24px; color:var(--gray-500);">No movements recorded yet.</td></tr>';
        return;
      }

      tbody.innerHTML = res.data.map(m => `
        <tr>
          <td>#${m.id}</td>
          <td><strong>${m.product_name || `Product #${m.product_id}`}</strong></td>
          <td>
            <span class="badge ${m.type === 'IN' ? 'badge-success' : 'badge-danger'}">
              ${m.type === 'IN' ? 'IN' : 'OUT'}
            </span>
          </td>
          <td><strong>${m.quantity}</strong></td>
          <td>${m.note || '-'}</td>
          <td>${new Date(m.date).toLocaleString()}</td>
        </tr>
      `).join('');
    }

    document.getElementById('stockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const productId = parseInt(document.getElementById('sProduct').value, 10);
      const type = document.getElementById('sType').value;
      const quantity = parseInt(document.getElementById('sQty').value, 10);
      const note = document.getElementById('sNote').value.trim();

      const res = await apiFetch('/stock', {
        method: 'POST',
        body: JSON.stringify({ product_id: productId, type, quantity, note })
      });

      if (res && res.ok) {
        showToast(res.data.message || 'Movement saved successfully', 'success');
        document.getElementById('stockForm').reset();
        await loadProductsDropdown();
        updateStockPreview();
        loadMovements();
        updateLowStockAlertBadge();
      } else {
        showToast(res.data.error || 'Failed to record movement', 'error');
      }
    });

    loadProductsDropdown();
    loadMovements();
  </script>
</body>
</html>
